name: Keep Radar awake

on:
  schedule:
    # Every 8 hours — comfortably under Streamlit Community Cloud's ~12h
    # inactivity sleep threshold.
    - cron: "0 */8 * * *"
  workflow_dispatch: {}

jobs:
  visit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python scripts/keep_alive.py
